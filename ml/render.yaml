services:
  - type: web
    name: revenueiq-ml
    env: python
    rootDir: ml
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python -m cmdstanpy.install_cmdstan
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9